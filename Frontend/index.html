<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sekou</title>
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

<!-- Menu latéral : nouvelle discussion, liste des discussions, compte -->
<aside id="sidebar" class="sidebar" aria-label="Menu">
    <div class="sidebar-head">
    <div class="sidebar-brand">
        <img src="logo.svg" alt="Sekou" class="sidebar-logo">
    </div>
    <div class="sidebar-head-actions">
        <!-- Bouton pour masquer la barre latérale comme Photo 1 -->
        <button type="button" id="toggle-sidebar" class="icon-btn sidebar-toggle-btn" aria-label="Fermer la barre latérale" title="Fermer la barre latérale">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="3" ry="3"/>
                <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
        </button>
    </div>
    </div>

    <button type="button" id="new-chat" class="new-chat">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4zM13.5 6.5l4 4"/></svg>
    Nouvelle discussion
    </button>

    <h2 class="side-title">Discussions</h2>
    <nav id="chat-list" class="chat-list" aria-label="Discussions récentes"></nav>

    <!-- Pied de barre latérale : Bouton Profil avec menu intégré comme Photo 2 -->
    <div class="sidebar-foot">
        <button type="button" id="profile-btn" class="profile-card-btn" aria-expanded="false" aria-controls="profile-menu">
            <div id="avatar" class="avatar" aria-hidden="true">?</div>
            <div class="user-info-text">
                <span id="user-name" class="user-name"></span>
                <span class="user-role">Membre Sekou · Free</span>
            </div>
            <svg class="profile-dots" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="1.5"/><circle cx="6" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/>
            </svg>
        </button>

        <!-- Menu déroulant profil / paramètres (Photo 2) -->
        <div id="profile-menu" class="chatgpt-popover profile-popover" hidden>
            <div class="popover-user-header">
                <div id="popover-avatar" class="avatar avatar-sm">?</div>
                <div class="popover-user-details">
                    <div id="popover-name" class="popover-name"></div>
                    <div class="popover-badge">Free</div>
                </div>
                <svg class="popover-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
            </div>
            <div class="popover-sep"></div>

            <button type="button" class="popover-row" id="menu-upgrade">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.2L12 17l-6.3 4.2 2.3-7.2-6-4.6h7.6z"/></svg>
                <span>Changer de forfait</span>
            </button>
            <button type="button" class="popover-row" id="menu-customize">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                <span>Personnalisation</span>
            </button>
            <button type="button" class="popover-row" id="menu-profile">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profil</span>
            </button>
            <div class="popover-row popover-settings-row">
                <div class="popover-row-left">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
                    <span>Paramètres (Voix)</span>
                </div>
                <label class="switch-mini" title="Lire les réponses à voix haute">
                    <input type="checkbox" id="speak" checked>
                    <span class="switch-slider"></span>
                </label>
            </div>

            <div class="popover-sep"></div>

            <button type="button" class="popover-row" id="menu-help">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <span>Aide</span>
                <svg class="popover-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
            </button>
            <button type="button" class="popover-row danger" id="logout-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Se déconnecter</span>
            </button>
        </div>
    </div>
</aside>
<div id="scrim" class="scrim" hidden></div>

<!-- Menu contextuel 3 points (Photo 3) -->
<div id="chat-context-menu" class="chatgpt-popover chat-context-menu" hidden>
    <button type="button" class="popover-row" data-action="share">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        <span>Partager</span>
    </button>
    <button type="button" class="popover-row" data-action="rename">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        <span>Renommer</span>
    </button>

    <div class="popover-sep"></div>

    <button type="button" class="popover-row" data-action="pin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-2l-3-3V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v7l-3 3v2z"/></svg>
        <span id="pin-action-label">Épingler le chat</span>
    </button>
    <button type="button" class="popover-row" data-action="lock">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span id="lock-action-label">Verrouiller le chat</span>
    </button>
    <button type="button" class="popover-row" data-action="archive">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        <span>Archiver</span>
    </button>
    <button type="button" class="popover-row danger" data-action="delete">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span>Supprimer</span>
    </button>
</div>

<!-- Notification toast -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div class="main">
    <header class="topbar">
    <button type="button" id="menu-btn" class="icon-btn sidebar-open-btn" aria-label="Ouvrir la barre latérale" title="Ouvrir la barre latérale" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3" ry="3"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
    </button>
    <span class="brand"><img src="logo-mark.svg" alt="" class="brand-mark"> Sekou</span>
    <button type="button" id="new-chat-top" class="icon-btn" aria-label="Nouvelle discussion" title="Nouvelle discussion">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4zM13.5 6.5l4 4"/></svg>
    </button>
    </header>

    <div class="chat-scroll" id="chat-scroll">
    <main id="chat" class="chat" aria-live="polite">
        <section id="welcome" class="welcome">
        <img src="logo.svg" alt="Sekou" class="welcome-logo">
        <p class="couk">COUK COUK !</p>
        <h1 class="welcome-title">Comment puis-je t'aider, <span id="welcome-name"></span> ?</h1>
        </section>
    </main>
    </div>

    <form id="form" class="composer">
        <!-- Zone de prévisualisation des fichiers attachés -->
        <div id="attachments-preview" class="attachments-preview" hidden></div>

        <!-- Menu déroulant du bouton '+' (Photo fournie) -->
        <div id="attach-menu" class="chatgpt-popover attach-popover" hidden>
            <button type="button" class="popover-row-rich" id="btn-upload-file">
                <div class="row-rich-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                </div>
                <div class="row-rich-text">
                    <div class="row-rich-title">Ajouter des photos et fichiers</div>
                    <div class="row-rich-desc">Importez des fichiers depuis l’ordinateur</div>
                </div>
            </button>
            <button type="button" class="popover-row-rich disabled" id="btn-library">
                <div class="row-rich-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                </div>
                <div class="row-rich-text">
                    <div class="row-rich-title">Ajouter depuis la bibliothèque</div>
                    <div class="row-rich-desc">Parcourez et recherchez vos fichiers</div>
                </div>
            </button>
            <button type="button" class="popover-row-rich disabled" id="btn-generate-image">
                <div class="row-rich-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                </div>
                <div class="row-rich-text">
                    <div class="row-rich-title">Créer une image</div>
                    <div class="row-rich-desc">Transformez vos idées en images</div>
                </div>
            </button>
        </div>

        <input type="file" id="file-input" multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.doc,.docx" hidden>

        <div class="composer-bar">
            <button type="button" id="attach" class="icon-btn attach-btn" aria-label="Ajouter un fichier" title="Ajouter des photos et fichiers" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <input id="text" type="text" placeholder="Demande à Sekou…" autocomplete="off" aria-label="Ton message">
            <button type="button" id="mic" class="icon-btn" aria-label="Dicter un message">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <button type="submit" id="send" class="send-btn" aria-label="Envoyer" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
            </button>
            <button type="button" id="handsfree-btn" class="send-btn" aria-pressed="false" aria-label="Mode mains libres" title="Mode mains libres : le micro se rouvre après chaque réponse">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4M9 6v12M13 3v18M17 8v8M21 11v2"/></svg>
            </button>
        </div>
    </form>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
