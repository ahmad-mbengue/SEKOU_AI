services:
  - type: web
    name: sekou-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health.php
    envVars:
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASS: "${DB_PASS}"

  - type: static
    name: sekou-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: ""
    staticPublishPath: ./Frontend
    envVars:
      RENDER_BACKEND_URL: "${RENDER_BACKEND_URL}" # set to https://sekou-backend.onrender.com
